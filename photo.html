		<div class="plant-gallery">
		        <div class="plant-card">
		            <img src="img/photo1.jpeg" class="plant-img" alt="向日葵">
		            <div class="plant-info">
		                <h3 class="plant-name">向日葵</h3>
		                <p class="plant-desc">
		                    向日葵因花序随太阳转动而得名，花朵明亮大方，适合观赏，种子可食用。
		                </p>
		            </div>
		        </div>

		        <div class="plant-card">
		            <img src="img/photo2.jpeg" class="plant-img" alt="绿萝">
		            <div class="plant-info">
		                <h3 class="plant-name">绿萝</h3>
		                <p class="plant-desc">
		                    绿萝是常见的室内观叶植物，生命力顽强，能有效净化空气。
		                </p>
		            </div>
		        </div>

		        <div class="plant-card">
		            <img src="img/plant3.jpg" class="plant-img" alt="多肉植物">
		            <div class="plant-info">
		                <h3 class="plant-name">多肉植物</h3>
		                <p class="plant-desc">
		                    多肉植物叶片肥厚多汁，耐旱性强，造型多样，适合盆栽。
		                </p>
		            </div>
		        </div>

		        <div class="plant-card">
		            <img src="img/photo3.jpg" class="plant-img" alt="玫瑰">
		            <div class="plant-info">
		                <h3 class="plant-name">玫瑰</h3>
		                <p class="plant-desc">
		                    玫瑰是爱情的象征，花色丰富，香气浓郁，可制作花茶或精油。
		                </p>
		            </div>
		        </div>

		        <div class="plant-card">
		            <img src="img/photo4.jpeg" class="plant-img" alt="仙人掌">
		            <div class="plant-info">
		                <h3 class="plant-name">仙人掌</h3>
		                <p class="plant-desc">
		                    仙人掌耐旱耐热，形态独特，部分品种可开花，适合沙漠风格装饰。
		                </p>
		            </div>
		        </div>
		    </div>
