<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title></title>
		<link rel="stylesheet" href="css/log.css"/>
		<style>
			*{
				margin: 0px;
				padding: 0px;
			}
		</style>
	</head>
	<body>
		<div class="logtop">
			<h1 style="font-family: '微软雅黑'; font-size: 24px;">植物简单科普网站登录</h1>
		</div>
		<div style="display: flex;">
			<div class="loglog">
			<table >
			    <tr>
					<td></td>
			        <td colspan="2" align="left">登录</td>
			    </tr>
			    <tr>
			        <td align="right">用户名:</td>
			        <td>
			            <input type="text" id="username" autocomplete="off" placeholder="请输入用户名">
			        </td>
			    </tr>
			    <tr>
			        <td align="right">密码:</td>
			        <td>
			            <input type="password" id="password" placeholder="请输入密码">
			        </td>
			    </tr>
			    <tr>
			        <td>&nbsp;</td>
			        <td>
						<input type="button" value="登录" onclick="log()"/>
						&nbsp;<a href="register.html">注册</a>
			        </td>
			    </tr>
			</table>
			</div>
			<div >
				<img src="img/log1.jpg" style="width: 474px; height: 600px;"/>
			</div>
			<div >
				<img src="img/log2.jpeg" style="width: 460px; height: 600px;"/>
			</div>
		</div>
		<script src="js/log.js"></script>
	</body>
</html>
